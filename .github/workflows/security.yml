name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Install govulncheck
        timeout-minutes: 5
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan the module
        timeout-minutes: 10
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./..."

      - name: Diagnostics on failure
        if: failure()
        run: |
          go version
          go env GOOS GOARCH GOMODCACHE
