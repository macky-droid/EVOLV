name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.30.0 (required for manual runs)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write # build provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before shipping
        run: go test ./... -count=1 -shuffle=on -timeout=10m

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          raw="$INPUT_VERSION"
          if [ -z "$raw" ]; then
            raw="${GITHUB_REF_NAME}"
          fi
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid release version: $raw (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        run: |
          mkdir -p dist
          build() {
            local os=$1 arch=$2
            local out="dist/evolv_${os}_${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "building $out (v$VERSION)"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X github.com/dxn111/EVOLV/internal/workspace.Version=$VERSION" \
              -o "$out" ./cmd/evolv
          }
          build linux amd64; build linux arm64
          build darwin amd64; build darwin arm64
          build windows amd64; build windows arm64

      - name: Smoke-test the release binary
        run: |
          chmod +x dist/evolv_linux_amd64
          got="$(dist/evolv_linux_amd64 --version)"
          want="evolv $VERSION"
          if [ "$got" != "$want" ]; then
            echo "version mismatch: got '$got', want '$want'" >&2
            exit 1
          fi

      - name: Checksums
        run: sha256sum dist/evolv_* > dist/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/evolv_*
            dist/checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/evolv_*
            dist/checksums.txt
