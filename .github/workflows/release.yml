name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.30.0 (required for manual runs)"
        required: true
        type: string
      dry_run:
        description: "Build and validate the artifacts, but do not publish a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.x"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          raw="$INPUT_VERSION"
          if [ -z "$raw" ]; then
            raw="${GITHUB_REF_NAME}"
          fi
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid release version: $raw (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        timeout-minutes: 15
        run: go test ./... -count=1 -shuffle=on -timeout=10m

      - name: Vet and build
        timeout-minutes: 10
        run: |
          go vet ./...
          go build ./...

      - name: Diagnostics on failure
        if: failure()
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOCACHE GOMODCACHE
          git status --short

  build:
    name: build / ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.x"

      - name: Build
        timeout-minutes: 8
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p dist
          out="dist/evolv_${GOOS}_${GOARCH}"
          [ "$GOOS" = "windows" ] && out="${out}.exe"
          echo "building $out (v$VERSION)"
          go build -trimpath \
            -ldflags="-s -w -X github.com/dxn111/EVOLV/internal/workspace.Version=$VERSION" \
            -o "$out" ./cmd/evolv
          ls -lh "$out"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: evolv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/evolv_*
          retention-days: 1
          if-no-files-found: error

  release:
    name: publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: evolv-*
          path: dist
          merge-multiple: true

      - name: Verify artifact set
        timeout-minutes: 3
        run: |
          expected=(
            evolv_linux_amd64
            evolv_linux_arm64
            evolv_darwin_amd64
            evolv_darwin_arm64
            evolv_windows_amd64.exe
            evolv_windows_arm64.exe
          )
          missing=0
          for f in "${expected[@]}"; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::missing release artifact: dist/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          ls -lh dist

      - name: Verify the Linux binary reports the release version
        timeout-minutes: 3
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          chmod +x dist/evolv_linux_amd64
          got="$(dist/evolv_linux_amd64 --version)"
          want="evolv $VERSION"
          if [ "$got" != "$want" ]; then
            echo "::error::version mismatch: got '$got', want '$want'"
            exit 1
          fi

      - name: Generate SBOM
        timeout-minutes: 10
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/evolv.spdx.json
          upload-artifact: false

      - name: Checksums
        run: |
          sha256sum dist/evolv_* dist/evolv.spdx.json > dist/checksums.txt
          sha256sum -c dist/checksums.txt

      - name: Attest build provenance
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/evolv_*
            dist/evolv.spdx.json
            dist/checksums.txt

      - name: Publish GitHub release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/evolv_*
            dist/evolv.spdx.json
            dist/checksums.txt

      - name: Diagnostics on failure
        if: failure()
        run: |
          ls -lhR dist || true
          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
