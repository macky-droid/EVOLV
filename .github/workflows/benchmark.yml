name: benchmark

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: true

jobs:
  redact:
    name: redaction benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go

      - name: Run benchmarks
        timeout-minutes: 15
        run: |
          go test ./internal/redact -run '^$' -bench . -benchmem -count=5 | tee benchmark.txt
          {
            echo "## Redaction benchmarks"
            echo '```'
            cat benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark output
        uses: actions/upload-artifact@v7
        with:
          name: redact-benchmark
          path: benchmark.txt
          retention-days: 30
          if-no-files-found: error
