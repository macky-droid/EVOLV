backend:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/**"
          - "cmd/**"

workflows:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "CONTRIBUTING.md"
          - "SECURITY.md"

assets:
  - changed-files:
      - any-glob-to-any-file:
          - "assets/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "go.mod"
          - "go.sum"
