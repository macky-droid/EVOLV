name: setup-go
description: Install the Go toolchain declared by go.mod and warm the module/build caches.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Show toolchain
      shell: bash
      run: |
        go version
        go env GOMOD GOVERSION
